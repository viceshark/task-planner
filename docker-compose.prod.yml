# Продакшен: приложение за reverse-proxy Caddy с автоматическим HTTPS (Let's Encrypt).
# Запуск: docker compose -f docker-compose.prod.yml up -d --build
# В .env должны быть DOMAIN, APP_USERNAME, APP_PASSWORD.
services:
  planner:
    build: .
    image: task-planner:latest
    container_name: task-planner
    # наружу порт не публикуем — доступ только через Caddy
    expose:
      - "8080"
    environment:
      APP_USERNAME: ${APP_USERNAME:-admin}
      APP_PASSWORD: ${APP_PASSWORD:-admin}
      APP_DB_PATH: /data/planner.db
      APP_SEED_EMPLOYEES: ${APP_SEED_EMPLOYEES:-true}
    volumes:
      - planner-data:/data
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: task-planner-caddy
    depends_on:
      - planner
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Укажите DOMAIN в .env, например vc-inc.tech}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  planner-data:
  caddy-data:
  caddy-config:
