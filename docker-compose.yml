services:
  planner:
    build: .
    image: task-planner:latest
    container_name: task-planner
    ports:
      - "${PORT:-8080}:8080"
    environment:
      # Логин/пароль для входа в приложение
      APP_USERNAME: ${APP_USERNAME:-admin}
      APP_PASSWORD: ${APP_PASSWORD:-admin}
      # Файл SQLite хранится в томе, чтобы данные переживали пересборку контейнера
      APP_DB_PATH: /data/planner.db
      # Создать демо-сотрудников при первом запуске
      APP_SEED_EMPLOYEES: ${APP_SEED_EMPLOYEES:-true}
    volumes:
      - planner-data:/data
    restart: unless-stopped

volumes:
  planner-data:
