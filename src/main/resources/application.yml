spring:
  application:
    name: task-planner
  datasource:
    # Путь к файлу базы задаётся переменной APP_DB_PATH (в Docker — /data/planner.db).
    # WAL + busy_timeout позволяют нескольким соединениям пула работать с SQLite без "database is locked".
    url: jdbc:sqlite:${APP_DB_PATH:./data/planner.db}?journal_mode=WAL&busy_timeout=10000&foreign_keys=on
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 4
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: none
    open-in-view: false
  sql:
    init:
      mode: always
  thymeleaf:
    cache: true

server:
  port: ${SERVER_PORT:8080}
  # За reverse-proxy (Caddy) доверяем X-Forwarded-*: редиректы и cookie будут https
  forward-headers-strategy: native
  error:
    whitelabel:
      enabled: true

app:
  security:
    username: ${APP_USERNAME:admin}
    password: ${APP_PASSWORD:admin}
  seed:
    # При первом запуске (пустая таблица сотрудников) создать демо-сотрудников
    employees: ${APP_SEED_EMPLOYEES:true}

logging:
  level:
    org.hibernate.SQL: warn
